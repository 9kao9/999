name: Lottery updater trigger (GitHub / manual)

on:
  # GitHub cron uses UTC. 06:35 UTC = 13:35 Asia/Bangkok.
  schedule:
    - cron: '35 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake-updater:
    uses: ./.github/workflows/scrapingant-production.yml
    with:
      scheduled_check: true
    secrets: inherit
