name: Lottery updater trigger (n8n / manual)

on:
  # n8n on the VPS is the only automatic scheduler. Keeping workflow_dispatch
  # here provides a manual emergency fallback without creating duplicate runs.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake-updater:
    uses: ./.github/workflows/scrapingant-production.yml
    with:
      scheduled_check: true
    secrets: inherit
