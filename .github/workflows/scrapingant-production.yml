name: Update lottery results with ScrapingAnt

on:
  workflow_call:
    inputs:
      scheduled_check:
        description: "ตรวจเฉพาะรายการที่ถึงเวลา"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      lottery_keys:
        description: "ชื่อรายการ คั่นด้วย comma (เว้นว่าง = ไม่เรียก API เพื่อป้องกันเครดิตหมด)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scrapingant-production.yml"
      - ".github/workflows/scrapingant-scheduler.yml"
      - "scrape_with_scrapingant.py"

permissions:
  contents: write

concurrency:
  group: scrapingant-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Choose only the lottery that is due
        id: choose
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_KEYS: ${{ inputs.lottery_keys }}
          SCHEDULED_CHECK: ${{ inputs.scheduled_check }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             [ "$SCHEDULED_CHECK" != "true" ]; then
            if [ -z "$MANUAL_KEYS" ]; then
              echo "keys=" >> "$GITHUB_OUTPUT"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "notice=หยุดเพื่อประหยัดเครดิต: กรุณาระบุชื่อหวยเมื่อต้องการรันด้วยตนเอง" >> "$GITHUB_OUTPUT"
            else
              echo "keys=$MANUAL_KEYS" >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "notice=รันด้วยตนเองเฉพาะรายการ: $MANUAL_KEYS" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Bangkok"))
          today = now.date().isoformat()
          weekday = now.weekday()
          minute = now.hour * 60 + now.minute
          path = Path("results.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}

          def has_date(key, expected):
              return any(
                  isinstance(item, dict) and item.get("date") == expected
                  for item in data.get(key, [])
              )

          due = []

          # ดาวโจนส์ออกช่วงเช้าวันอังคาร-เสาร์ และเป็นงวดวันก่อนหน้า
          if weekday in {1, 2, 3, 4, 5} and 203 <= minute <= 300:
              expected = (now.date() - timedelta(days=1)).isoformat()
              if not has_date("dow", expected):
                  due.append("dow")

          if weekday <= 4:
              # เริ่มดึงนิเคอิเช้าเวลา 09:35 น. และหยุดก่อนตลาดรอบบ่าย
              # เพื่อป้องกันค่ารอบบ่ายถูกบันทึกผิดเป็นผลนิเคอิเช้า
              if 575 <= minute <= 625 and not has_date("nikkei_morning", today):
                  due.append("nikkei_morning")
              # ติดตามต่อถึง 18:00 น. เผื่อ scheduled run ถูก GitHub เลื่อน
              # เริ่มดึงนิเคอิบ่ายเวลา 13:20 น. ตามเวลาประเทศไทย
              if 800 <= minute <= 1080 and not has_date("nikkei_afternoon", today):
                  due.append("nikkei_afternoon")
              if 1008 <= minute <= 1110 and not has_date("thai_stock", today):
                  due.append("thai_stock")
              # เริ่มตรวจหวยลาวหลังเวลาออก 1 นาที (20:31 น.)
              if 1231 <= minute <= 1320 and not has_date("lao", today):
                  due.append("lao")

          if now.day in {1, 16} and 963 <= minute <= 1080:
              if not has_date("government", today):
                  due.append("government")

          daily_windows = {
              # เริ่มตรวจหลังเวลาออก 1 นาที เพราะทั้งสามแหล่งเป็นต้นทางตรง
              "hanoi_special": (1051, 1140),
              "hanoi_normal": (1111, 1200),
              "hanoi_vip": (1171, 1260),
          }
          for key, (start, end) in daily_windows.items():
              if start <= minute <= end and not has_date(key, today):
                  due.append(key)

          # If ExpHuay/Cloudflare has just blocked a lottery, wait 30 minutes
          # before trying that same lottery again. n8n can still wake this
          # workflow every 5 minutes without repeatedly spending browser
          # credits during a temporary block.
          recent_failures = set()
          meta = data.get("_meta", {})
          try:
              last_run = datetime.fromisoformat(meta.get("last_run", ""))
              if now - last_run < timedelta(minutes=30):
                  recent_failures = set(meta.get("errors", {}))
          except (TypeError, ValueError):
              pass
          # The three Hanoi sources are now direct and cost 0 credits, so they
          # may retry on every 5-minute wake until today's dated result exists.
          recent_failures -= {
              "lao",
              "hanoi_special",
              "hanoi_normal",
              "hanoi_vip",
          }
          cooling_down = [key for key in due if key in recent_failures]
          due = [key for key in due if key not in recent_failures]

          keys = ",".join(dict.fromkeys(due))
          print(f"keys={keys}")
          print(f"should_run={'true' if keys else 'false'}")
          print(
              f"notice=เวลาไทย {now:%Y-%m-%d %H:%M}; "
              f"รายการที่ต้องดึง: {keys or 'ไม่มี'}; "
              f"พักหลังถูกบล็อก: {','.join(cooling_down) or 'ไม่มี'}"
          )
          PY

      - name: Set up Python
        if: steps.choose.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.choose.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Scrape selected result with JavaScript
        if: steps.choose.outputs.should_run == 'true'
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_BROWSER: "true"
          LOTTERY_KEYS: ${{ steps.choose.outputs.keys }}
        run: python scrape_with_scrapingant.py

      - name: Save results to GitHub
        if: always() && steps.choose.outputs.should_run == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const fs = require("fs");
            const path = "results.json";
            const branch = context.ref.replace("refs/heads/", "");
            const localContent = fs.readFileSync(path, "utf8");
            const localData = JSON.parse(localContent);
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });
            const remoteContent = Buffer.from(
              current.data.content,
              "base64"
            ).toString("utf8");
            const remoteData = JSON.parse(remoteContent);

            // Another lottery job may have committed after this job checked
            // out the repository. Merge only the lottery keys updated by this
            // run into the newest remote file so an older checkout cannot
            // erase results saved by a different job.
            const updatedKeys = Array.isArray(localData?._meta?.updated)
              ? localData._meta.updated
              : [];
            for (const key of updatedKeys) {
              if (Array.isArray(localData[key])) {
                remoteData[key] = localData[key];
              }
            }
            remoteData._meta = localData._meta;
            const mergedContent = JSON.stringify(remoteData, null, 2) + "\n";

            if (mergedContent === remoteContent) {
              core.info("No data changes");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: "chore: update selected lottery result",
              content: Buffer.from(mergedContent).toString("base64"),
              sha: current.data.sha
            });
            core.info("results.json updated successfully");
