name: Update lottery results with ScrapingAnt

on:
  workflow_call:
    inputs:
      scheduled_check:
        description: "ตรวจเฉพาะรายการที่ถึงเวลา"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      lottery_keys:
        description: "ชื่อรายการ คั่นด้วย comma (เว้นว่าง = ไม่เรียก API เพื่อป้องกันเครดิตหมด)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scrapingant-production.yml"
      - ".github/workflows/scrapingant-scheduler.yml"
      - "scrape_with_scrapingant.py"

permissions:
  contents: write

concurrency:
  group: scrapingant-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Choose only the lottery that is due
        id: choose
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_KEYS: ${{ inputs.lottery_keys }}
          SCHEDULED_CHECK: ${{ inputs.scheduled_check }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             [ "$SCHEDULED_CHECK" != "true" ]; then
            if [ -z "$MANUAL_KEYS" ]; then
              echo "keys=" >> "$GITHUB_OUTPUT"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "notice=หยุดเพื่อประหยัดเครดิต: กรุณาระบุชื่อหวยเมื่อต้องการรันด้วยตนเอง" >> "$GITHUB_OUTPUT"
            else
              echo "keys=$MANUAL_KEYS" >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "notice=รันด้วยตนเองเฉพาะรายการ: $MANUAL_KEYS" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Bangkok"))
          today = now.date().isoformat()
          weekday = now.weekday()
          minute = now.hour * 60 + now.minute
          path = Path("results.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}

          def has_date(key, expected):
              return any(
                  isinstance(item, dict) and item.get("date") == expected
                  for item in data.get(key, [])
              )

          due = []

          # ดาวโจนส์ออกช่วงเช้าวันอังคาร-เสาร์ และเป็นงวดวันก่อนหน้า
          if weekday in {1, 2, 3, 4, 5} and 203 <= minute <= 300:
              expected = (now.date() - timedelta(days=1)).isoformat()
              if not has_date("dow", expected):
                  due.append("dow")

          if weekday <= 4:
              # เปิดช่วงติดตามต่อถึง 18:00 น. เผื่อ GitHub เลื่อนหรือข้าม
              # scheduled run หลังเวลาออก โดยไม่เสียเครดิตเมื่อมีผลแล้ว
              if 573 <= minute <= 1080 and not has_date("nikkei_morning", today):
                  due.append("nikkei_morning")
              # ติดตามต่อถึง 18:00 น. เผื่อ scheduled run ถูก GitHub เลื่อน
              if 783 <= minute <= 1080 and not has_date("nikkei_afternoon", today):
                  due.append("nikkei_afternoon")
              if 1008 <= minute <= 1110 and not has_date("thai_stock", today):
                  due.append("thai_stock")
              if 1233 <= minute <= 1320 and not has_date("lao", today):
                  due.append("lao")

          if now.day in {1, 16} and 963 <= minute <= 1080:
              if not has_date("government", today):
                  due.append("government")

          daily_windows = {
              "hanoi_special": (1053, 1140),
              "hanoi_normal": (1113, 1200),
              "hanoi_vip": (1173, 1260),
          }
          for key, (start, end) in daily_windows.items():
              if start <= minute <= end and not has_date(key, today):
                  due.append(key)

          keys = ",".join(dict.fromkeys(due))
          print(f"keys={keys}")
          print(f"should_run={'true' if keys else 'false'}")
          print(
              f"notice=เวลาไทย {now:%Y-%m-%d %H:%M}; "
              f"รายการที่ต้องดึง: {keys or 'ไม่มี'}"
          )
          PY

      - name: Set up Python
        if: steps.choose.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.choose.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Scrape selected result with JavaScript
        if: steps.choose.outputs.should_run == 'true'
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_BROWSER: "true"
          LOTTERY_KEYS: ${{ steps.choose.outputs.keys }}
        run: python scrape_with_scrapingant.py

      - name: Save results to GitHub
        if: always() && steps.choose.outputs.should_run == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const fs = require("fs");
            const path = "results.json";
            const branch = context.ref.replace("refs/heads/", "");
            const localContent = fs.readFileSync(path, "utf8");
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });
            const remoteContent = Buffer.from(
              current.data.content,
              "base64"
            ).toString("utf8");
            if (localContent === remoteContent) {
              core.info("No data changes");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: "chore: update selected lottery result",
              content: Buffer.from(localContent).toString("base64"),
              sha: current.data.sha
            });
            core.info("results.json updated successfully");
